syntax = "proto3";

package eniad.comparison.v1;

option csharp_namespace = "EniadCsharpDotnet.Enterprise.Grpc";

// Enterprise gRPC bidirectional streaming contract (#112)
service NumberComparisonService {
  rpc CompareUnary (CompareRequestMessage) returns (CompareReplyMessage);
  rpc CompareStream (stream CompareRequestMessage) returns (stream CompareReplyMessage);
}

message CompareRequestMessage {
  int32 first_value = 1;
  int32 second_value = 2;
  string correlation_id = 3;
}

message CompareReplyMessage {
  int32 larger_value = 1;
  bool are_equal = 2;
  int64 delta = 3;
  string trace_id = 4;
}
